<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер GS1 DataMatrix</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col items-center p-4">
    <header class="w-full max-w-md text-center my-4">
        <h1 class="text-2xl font-bold text-gray-800">Проверка маркировки</h1>
        <p class="text-sm text-gray-500">Наведите камеру на код DataMatrix</p>
    </header>
    <main class="w-full max-w-md bg-white rounded-2xl shadow-md overflow-hidden p-4 flex flex-col gap-4">
        <div class="relative rounded-xl overflow-hidden bg-black aspect-square w-full">
            <div id="reader" class="w-full h-full"></div>
        </div>
        <button id="btn-restart" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition">
            Сканировать еще раз
        </button>
        <div id="result-container" class="border border-gray-200 rounded-xl p-4 min-h-[100px] flex flex-col justify-center bg-gray-50">
            <div id="result-status" class="text-center text-gray-500 font-medium">Камера готова к работе</div>
            <div id="result-data" class="hidden mt-2 text-sm text-gray-700 space-y-1"></div>
        </div>
    </main>
    <script>
        // Вставь сюда свой URL вместо этой заглушки:
        const YANDEX_FUNCTION_URL = 'https://functions.yandexcloud.net/ТВОЙ_ИДЕНТИФИКАТОР_ФУНКЦИИ';

        const statusEl = document.getElementById('result-status');
        const dataEl = document.getElementById('result-data');
        const restartBtn = document.getElementById('btn-restart');
        const html5QrCode = new Html5Qrcode("reader");
        const config = { 
            fps: 15, 
            qrbox: (width, height) => {
                const minWidth = Math.min(width * 0.8);
               const minHeight = Math.min(height * 0.8);
                
                return { width: minWidth, height: minHeight };
            },
            formatsToSupport: [ Html5QrcodeSupportedFormats.DATA_MATRIX ] ,
             // Запрашиваем у камеры высокое разрешение здесь:
    videoConstraints: {
        width: { ideal: 1920 },
        height: { ideal: 1080 }
    }
        };
        function startScanner() {
            statusEl.innerText = "Поиск DataMatrix кодов...";
            statusEl.className = "text-center text-blue-600 font-medium";
            dataEl.classList.add('hidden');
            dataEl.innerHTML = '';
            restartBtn.classList.add('hidden');
            html5QrCode.start({ facingMode: "environment"}, config, onScanSuccess, onScanFailure)
            .catch(err => {
                statusEl.innerText = "Ошибка доступа к камере: " + err;
                statusEl.className = "text-center text-red-600 font-medium";
            });
        }
        function onScanSuccess(decodedText, decodedResult) {
            html5QrCode.stop();
            if (navigator.vibrate) navigator.vibrate(100);
            statusEl.innerText = "Код считан. Запрос в систему...";
            statusEl.className = "text-center text-yellow-600 font-medium";
            fetch(YANDEX_FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: decodedText })
            })
            .then(res => {
                if (!res.ok) throw new Error("Ошибка сервера: " + res.status);
                return res.json();
            })
            .then(data => {
                statusEl.innerText = "Данные успешно получены";
                statusEl.className = "text-center text-green-600 font-bold text-lg";
                dataEl.innerHTML = `
                    <div class="border-t border-gray-200 pt-2">
                        <p class="text-xs text-gray-400 font-mono break-all"><b>Raw Code:</b> ${data.scanned_code || decodedText}</p>
                    </div>
                    <div class="mt-2">
                        <p class="text-base text-gray-900 font-semibold">${data.product_name || 'Наименование не найдено'}</p>
                        <p class="text-sm text-gray-500"><b>GTIN:</b> ${data.gtin || '—'}</p>
                        <p class="text-sm text-gray-500"><b>Статус:</b> ${data.verified ? 'Проверен ✅' : 'Ошибка проверки ❌'}</p>
                    </div>
                `;
                dataEl.classList.remove('hidden');
                restartBtn.classList.remove('hidden');
            })
            .catch(err => {
                statusEl.innerText = "Ошибка API: " + err.message;
                statusEl.className = "text-center text-red-600 font-medium";
                restartBtn.classList.remove('hidden');
            });
        }
        function onScanFailure(error) {}
        restartBtn.addEventListener('click', startScanner);
        window.addEventListener('DOMContentLoaded', startScanner);
    </script>
</body>
</html>
